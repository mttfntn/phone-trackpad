# Tests on every push / pull request, on Windows and macOS with every supported Python.
# A pushed version tag (vX.Y.Z) also checks the tag against the version, builds the zip and
# publishes a GitHub release. No artifacts are stored (artifact storage is an account-wide
# quota): the release job builds the zip itself.
name: tests

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        # Supported Python versions (pyproject.toml; tests/test_project.py checks they match).
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # PyPI is the only official source for these packages, so: pip's own retries, plus
      # three attempts in case a whole install is cut off.
      - name: Install the app's requirements
        shell: bash
        run: |
          for attempt in 1 2 3; do
            python -m pip install --disable-pip-version-check --retries 5 --timeout 60 -r desktop/requirements.txt && exit 0
            echo "pip install failed (attempt $attempt), retrying in 15 s"; sleep 15
          done
          exit 1

      - name: Tests (Python suite and phone page suite)
        run: python tests/run_tests.py

  package:
    name: package (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build the zip
        run: python tools/build_package.py

      # Unzips it and starts it with the launcher for this system, which sets up its own
      # environment from PyPI, like a user's first run (in a throwaway home folder).
      - name: Check the zip as a user would run it
        shell: bash
        run: |
          for attempt in 1 2; do
            python tests/check_package.py dist/phone-trackpad-*.zip && exit 0
            echo "package check failed (attempt $attempt)"; sleep 15
          done
          exit 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # actions/checkout leaves the tag lightweight; fetch it for its annotated message.
      - name: Fetch the tag itself (annotated message)
        run: git fetch --force origin "+${GITHUB_REF}:${GITHUB_REF}"

      - name: Check the tag matches the version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          APP=$(python3 -c "import sys;sys.path.insert(0,'desktop');import version;print(version.VERSION)")
          [ "$VER" = "$APP" ] || { echo "pyproject.toml says $VER, desktop/version.py says $APP"; exit 1; }
          [ "$TAG" = "v$VER" ] || { echo "Tag $TAG does not match version $VER"; exit 1; }

      - name: Build the zip
        run: python3 tools/build_package.py

      # Safe to re-run: if the release already exists (a re-run of the tag's workflow),
      # its zip and notes are replaced instead of failing.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > notes.md
          [ -s notes.md ] || echo "Release ${GITHUB_REF_NAME}" > notes.md
          cat notes.md
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            echo "Release exists: updating its zip and notes"
            gh release upload "${GITHUB_REF_NAME}" dist/phone-trackpad-*.zip --clobber
            gh release edit "${GITHUB_REF_NAME}" --notes-file notes.md
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" dist/phone-trackpad-*.zip \
            --title "Phone Trackpad ${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag

      # Data for the README's "download size" badge (shields.io endpoint format; shields.io
      # can't read release files). It lives on main as .github/release-size.json and is
      # updated here, as one bot commit on main, after each release. No other branch is used.
      # Pushes made with GITHUB_TOKEN start no new workflow run.
      - name: Update the download-size badge data on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip=$(ls dist/*.zip | head -n 1)
          work=$(mktemp -d)
          git clone -q --depth 1 --branch main "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$work"
          python3 - "$zip" "$work/.github/release-size.json" <<'PY'
          import json, os, sys
          size = os.path.getsize(sys.argv[1])
          text = f"{size / 1024:.1f} KB" if size < 1024 ** 2 else f"{size / 1024 ** 2:.1f} MB"
          with open(sys.argv[2], "w") as f:
              json.dump({"schemaVersion": 1, "label": "download size", "message": text, "color": "blue"}, f)
              f.write("\n")
          print(text)
          PY
          cd "$work"
          git add .github/release-size.json
          if git diff --cached --quiet; then echo "Size unchanged: nothing to commit"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Download-size badge data for ${GITHUB_REF_NAME} [skip ci]"
          git push -q origin HEAD:main
