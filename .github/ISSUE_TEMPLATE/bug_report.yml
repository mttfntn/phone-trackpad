name: Bug report
description: Something does not work as described in the README
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check the [README](https://github.com/mttfntn/phone-trackpad#start) first, including the [known limits](https://github.com/mttfntn/phone-trackpad#known-limits), and whether an issue for the same problem already exists. Security problems: please use [private reporting](https://github.com/mttfntn/phone-trackpad/security/advisories/new) instead.

  - type: input
    id: version
    attributes:
      label: Phone Trackpad version
      description: The first line the helper prints, "Phone Trackpad X.Y.Z running as ...".
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Computer
      options:
        - Windows
        - macOS
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: System and Python version
      placeholder: "Windows 11 24H2, Python 3.13.1"
    validations:
      required: true

  - type: input
    id: phone
    attributes:
      label: Phone and browser
      description: Also say whether you use the page from the home screen.
      placeholder: "iPhone 15, iOS 26, Safari (home screen)"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The gesture or key, and the app you were using on the computer.
      placeholder: |
        1. Start Phone Trackpad and pair
        2. Open TextEdit and tap in the text
        3. ...
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: What the helper printed
      description: Copy the text from the helper's window (leave out the QR code and PIN).
      render: shell
